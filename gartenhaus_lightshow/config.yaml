name: Gartenhaus Lichtshow
version: "0.2.2"
slug: gartenhaus_lightshow
description: Hue-Entertainment-Dienst fuer das Gartenhaus (Phase 2, Testlauf)
url: https://github.com/felixxx404/homeassistant
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
# Zeit fuer sauberes Stream-Ende und Wiederherstellen der Lampen beim Stoppen.
timeout: 60
# Bridge-Adresse und Bridge-ID traegt Felix in den App-Optionen ein (nicht im Repo).
options:
  bridge_host: ""
  bridge_id: ""
  testlauf: true
schema:
  bridge_host: str
  bridge_id: str
  testlauf: bool
