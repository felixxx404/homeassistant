name: Gartenhaus Lichtshow
version: "0.3.0"
slug: gartenhaus_lightshow
description: Hue-Entertainment-Lichtshow fuer das Gartenhaus, Steuerung aus Home Assistant
url: https://github.com/felixxx404/homeassistant
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
# MQTT-Zugangsdaten der Mosquitto-App fuer die Entitaeten in Home Assistant.
services:
  - mqtt:need
# Zeit fuer sauberes Stream-Ende und Wiederherstellen der Lampen beim Stoppen.
timeout: 60
# Bridge-Adresse und Bridge-ID traegt Felix in den App-Optionen ein (nicht im Repo).
options:
  bridge_host: ""
  bridge_id: ""
schema:
  bridge_host: str
  bridge_id: str
