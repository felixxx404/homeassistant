# Lampen-Mapping Gartenhaus (einzige Quelle fuer Lampen und Positionen)
#
# Zuordnung ueber light_id (Hue light resource id). "kanal" ist der Stand bei der
# Erfassung im Bereich "Gartenhaus (SYNC HA)" am 28.10.2026; der Dienst liest den
# aktuellen Kanal beim Start aus der Bridge und richtet sich nach der light_id.
#
# position_m: Mitte der Lampe in Metern laut Grundriss von Felix.
#   Ursprung oben links, X nach rechts, Y nach unten, Z vom Boden nach oben.
# position_hue: daraus berechnet (x = X/2 - 1, y = 1 - Y/3, z = Z/1,6 - 1).
#   Der Dienst prueft beim Laden, dass beide Angaben zusammenpassen.
#   Die Werte werden NICHT auf die Bridge geschrieben.
#
# Bridge-Adresse und Bridge-ID stehen nicht hier, sondern in den App-Optionen in HA.
#
# Nicht im Stream: light.gartenhaus_laser (Hue Smart Plug, kein Entertainment-Dienst).

raum:
  breite_m: 4.0
  tiefe_m: 6.0
  hoehe_m: 3.2

entertainment_bereich: "Gartenhaus (SYNC HA)"

lampen:
  - name: "6G Waschbeckenlampe"
    light_id: "ff8ff4cb-4c72-4916-964c-30e035bee0cb"
    ha_entity: "light.gartenhaus_6g_waschbeckenlampe"
    kanal: 5
    position_m: {x: 0.40, y: 0.00, z: 2.10}
    position_hue: {x: -0.8, y: 1.0, z: 0.3125}

  - name: "4G Schrankbeleuchtung"
    light_id: "040d1d3f-ec05-4c5b-b791-17738fa376ca"
    ha_entity: "light.gartenhaus_4g_schrankbeleuchtung"
    kanal: 3
    position_m: {x: 3.00, y: 0.10, z: 0.80}
    position_hue: {x: 0.5, y: 0.9667, z: -0.5}

  - name: "5G Wandlampe"
    light_id: "7d116f0f-a4db-46f1-9ac8-56ec8d74e876"
    ha_entity: "light.gartenhaus_5g_wandlampe"
    kanal: 4
    position_m: {x: 4.00, y: 1.50, z: 2.55}
    position_hue: {x: 1.0, y: 0.5, z: 0.5937}

  - name: "3G Deckenleuchte rechts"
