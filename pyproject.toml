[tool.pytest.ini_options]
pythonpath = ["gartenhaus_lightshow", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "simulation: Test gegen die SIMULIERTE Bridge (kein Test an echter Hardware)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["lightshow", "sim"]
